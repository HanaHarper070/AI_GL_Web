<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=ai.html">
  <title>ระบบอบรมการประยุกต์ใช้ AI สำหรับ อปท.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      text-align: center;
    }
    .box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      margin: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { font-size: 16px; opacity: 0.9; margin-bottom: 24px; }
    a.btn {
      display: inline-block;
      padding: 12px 28px;
      background: white;
      color: #0369a1;
      font-weight: 700;
      border-radius: 9999px;
      text-decoration: none;
      transition: transform 0.2s;
    }
    a.btn:hover { transform: scale(1.05); }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    window.location.replace("ai.html");
  </script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>กำลังนำท่านเข้าสู่ระบบฝึกอบรม AI สำหรับ อปท.</h1>
    <p>ระบบกำลังพาไปยังเว็บแอปพลิเคชันการเรียนรู้...</p>
    <a href="ai.html" class="btn">คลิกที่นี่หากไม่เปลี่ยนหน้าอัตโนมัติ</a>
  </div>
</body>
</html>
